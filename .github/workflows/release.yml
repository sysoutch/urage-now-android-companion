name: Release Android Companion

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (for example v0.14.18)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed Android release
    runs-on: ubuntu-latest
    env:
      ANDROID_RELEASE_KEYSTORE: ${{ runner.temp }}/urage-now-release.keystore
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate tag and release signing secrets
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(awk -F= '/^VERSION_NAME=/{print $2}' version.properties)"
          tag_name="${{ inputs.tag || github.ref_name }}"
          test -n "$version_name"
          test "$tag_name" = "v$version_name"
          test -n "$ANDROID_RELEASE_STORE_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_ALIAS"
          test -n "$ANDROID_RELEASE_KEY_PASSWORD"
          test -n "${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}"

      - name: Restore the release keystore
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}' | base64 --decode > "$ANDROID_RELEASE_KEYSTORE"
          test -s "$ANDROID_RELEASE_KEYSTORE"

      - name: Build ABI APKs and App Bundle
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify and checksum artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          find app/build/outputs/apk/release -type f -name '*.apk' -exec cp {} release-artifacts/ \;
          find app/build/outputs/bundle/release -type f -name '*.aab' -exec cp {} release-artifacts/ \;
          test "$(find release-artifacts -type f | wc -l)" -ge 5
          (cd release-artifacts && sha256sum * > SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: URage Now Android Companion ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/*.apk
            release-artifacts/*.aab
            release-artifacts/SHA256SUMS.txt
